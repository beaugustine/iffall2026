<!DOCTYPE html>
<!-- saved from url=(0055)https://wudesign.me/resources/button_styling/index.html -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		
		
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Buttons — Bea Augustine</title>
        
        <link rel="stylesheet" href="https://use.typekit.net/xcv4cio.css">
		
		<style>
            body {
				color: #333;
				font-family: 'Open Sans', sans-serif;
				margin: 0;
				padding: 0;
			}

			main {
				margin: 40px;
			}

			h1 {
			 	font-size: 30px;
			 	margin-bottom: 40px;
			}

            .button_container {
				border: 1px solid #ddd;
				margin: 0 10px 10px 0;
				padding: 20px;
				width: 300px;
				height: 300px;
				float: left;
				overflow: hidden;
				box-sizing: border-box;
				text-align: center;
			}

            a#btn_newyorker {
				position: relative;
                display: inline-block;
				height: 75px;
				box-sizing: border-box;
				border-radius: 40px;
				margin: auto;
				margin-top: 85px;
				padding: 12px 15px 40px 15px;
				background-color: white;
				border: 4px solid #ED1C24;
				color: black;
				font-size: 25px;
				font-family: "playfair-display", serif;
                font-weight: bold;
				font-variant: small-caps;
				text-decoration: none;
				transition: all .5s;
			}

            a#btn_newyorker:hover {
                color: white;
                background-color: black;
            }

            a#btn_newyorker:active {
                color: #ED1C24;
                background-color: white;
                border: 4px solid black;
            }

            .new-yorker-logo {
                position: absolute;
                top: -65px;
                left: 90px;
            }

            .new-yorker-logo img {
                display: block;
                width: 80px;
                height: auto;
                transition: transform 0.5s ease;
                transform-origin: center;
                opacity: 0;
            }

            a#btn_newyorker:hover .new-yorker-logo img {
                transform: translateY(-10px) scale(1.2);
                opacity: 100;
            }

            a#btn_cartoonnetwork {
				position: relative;
                display: inline-block;
				box-sizing: border-box;
				margin: auto;
				margin-top: 115px;
				background-color: black;
				color: white;
				font-size: 15px;
				font-family: "interstate", sans-serif;
                font-weight: 800;
                font-style: normal;
				text-decoration: none;
				transition: all .15s;
                padding: 10px 10px 10px 10px;
			}
			
            .cartoon-network-logo {
                position: absolute;
                top: -40px;
                left: 48.5px;
            }

            .cartoon-network-logo img {
                display: block;
                width: 80px;
                height: auto;
				transition: transform 0.5s ease;
				box-shadow: 0px 0px 0 2px black;
            }

			a#btn_cartoonnetwork:hover .cartoon-network-logo img{
				transform: translateY(-25px) scale(1.97);
				box-shadow: 0px 0px 0 5px black;
			}

			a#btn_cartoonnetwork:active {
				background-color: #00AEEF;
			}
			
			a#btn_cartoonnetwork:active .cartoon-network-logo img{
				box-shadow: 0px 0px 0 5px #ED008C;
			}

			a#btn_mobot {
				position: relative;
                display: inline-block;
				height: 130px;
				width: 180px;
				box-sizing: border-box;
				border-radius: 40px;
				margin: auto;
				margin-top: 60px;
				padding: 18px 10px 10px 10px;
				background-color: white;
				border: 8px solid #006B36;
				background-color: rgba(0, 107, 54, .25);
				color: #006B36;
				font-size: 22px;
				font-family: "transat-text", sans-serif;
				font-weight: 700;
				font-style: normal;
				text-decoration: none;
				transition: all .5s;
			}

			a#btn_mobot:hover {
				background-color: #006B36;
				color: white;
				transform: scale(1.1);
			}

			.instagram-logo {
				position: relative;
                top: 70px;
                left: 73px;
			}

			.instagram-logo img {
				display: block;
                width: 110px;
                height: auto;
			}

			a#btn_instagram:hover .instagram-logo img {
				animation-name: jump;
    			animation-duration: 1s;
			}

			@keyframes jump {
				50% {transform: translateY(-20px) scale(1.2);}
				100% {transform: translateY(0) scale(1) rotate(360deg);}
			}

			a#btn_lyft {
				position: relative;
                display: inline-block;
				height: 60px;
				width: 150px;
				box-sizing: border-box;
				border-radius: 40px;
				margin: auto;
				margin-top: 100px;
				padding: 3px 0;
				background-color: white;
				border: 4px solid #FF00BF;
				color: #FF00BF;
				font-size: 30px;
				font-family: "work-sans", sans-serif;
				font-weight: 900;
				font-style: normal;
				text-decoration: none;
				transition: all .5s;
			}

			a#btn_lyft:hover {
				background-color: #FF00BF;
				color: white;
				transform: scale(1.1);
				box-shadow: 0px 0px 15px 5px #FF00BF;
			}


		</style>
	</head>
	<body>
		
		<main>

			<h1>Button Styling — Bea Augustine</h1>
			
			<div class="button_container">
				<a href="https://www.newyorker.com/" target="_blank" id="btn_newyorker">The New Yorker
                    <div class="new-yorker-logo">
                        <img src="images/new-yorker-logo.webp" alt="New Yorker Logo">
                    </div>
                </a>

			</div>

			<div class="button_container">
				<a href="https://www.hbomax.com/channel/cartoon-network" target="_blank" id="btn_cartoonnetwork">CARTOON NETWORK
                    <div class="cartoon-network-logo">
                        <img src="images/cn-logo.webp" alt="Cartoon Network Logo">
                    </div>
                </a>
			</div>

			<div class="button_container">
				<a href="https://www.missouribotanicalgarden.org/" target="_blank" id="btn_mobot">MISSOURI BOTANICAL GARDEN</a>
			</div>

			<div class="button_container">
				<a href="https://www.instagram.com/" target="_blank" id="btn_instagram">
					<div class="instagram-logo">
                        <img src="images/ig-color.webp" alt="Instagram Logo">
                    </div>
				</a>
			</div>

            <div class="button_container">
				<a href="https://www.lyft.com/" target="_blank" id="btn_lyft">lyft</a>
			</div>

		</main>	

	
</body></html>
